<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><!-- only reachable by its link: not in the menu, and kept out of search -->
  <link rel="icon" href="../shared/clip.svg">
  <script src="../shared/flags.js"></script>
  <script src="../shared/tool-head.js"></script>
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="../shared/tools.css">
  <link rel="stylesheet" href="qr.css">
  <script src="../shared/look.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="../shared/mode.js"></script>
  <script type="module" src="qr.js"></script>
  <title data-t="page.title">QR codes</title>
</head>
<body>
  <div class="page">
    <header class="bar">
      <a class="home" data-home href="../"><span data-t="site.first_name">William</span> <span data-t="site.last_name">Harrison</span></a>
      <nav>
        <a href="../#writing" data-t="nav.writing">Writing</a>
        <a href="../#projects" data-t="nav.projects">Projects</a>
      </nav>
    </header>

    <main>
      <h1 data-t="page.heading">QR codes</h1>
      <p class="sub" data-t="page.intro">Everything happens in your browser; nothing you type is sent anywhere.</p>

      <div class="maker">
        <form id="form" class="controls" onsubmit="return false">
          <label for="text" data-t="controls.text">Text or link</label>
          <textarea id="text" rows="3">https://github.com/wharrison2</textarea>

          <div class="fields">
            <div>
              <label for="ecl" data-t="controls.ecl">Error correction</label>
              <select id="ecl">
                <option value="L" data-t="controls.ecl_low">Low (7%)</option>
                <option value="M" selected data-t="controls.ecl_medium">Medium (15%)</option>
                <option value="Q" data-t="controls.ecl_quartile">Quartile (25%)</option>
                <option value="H" data-t="controls.ecl_high">High (30%)</option>
              </select>
            </div>
            <div>
              <label for="shape" data-t="controls.shape">Shape</label>
              <select id="shape">
                <option value="square" data-t="controls.shape_square">Squares</option>
                <option value="rounded" data-t="controls.shape_rounded">Rounded</option>
                <option value="dots" data-t="controls.shape_dots">Dots</option>
              </select>
            </div>
            <div>
              <label for="margin" data-t="controls.margin">Margin</label>
              <input id="margin" type="number" min="0" max="10" value="4">
            </div>
          </div>
          <div class="fields colors">
            <div>
              <label for="fg" data-t="controls.fg">Foreground</label>
              <input id="fg" type="color" value="#1e2230">
            </div>
            <div>
              <label for="bg" data-t="controls.bg">Background</label>
              <input id="bg" type="color" value="#ffffff">
            </div>
            <div>
              <label for="size" data-t="controls.size">PNG size</label>
              <select id="size">
                <option value="512" data-t="controls.size_512">512 px</option>
                <option value="1024" selected data-t="controls.size_1024">1024 px</option>
                <option value="2048" data-t="controls.size_2048">2048 px</option>
              </select>
            </div>
          </div>
          <p class="warning" id="warning" hidden></p>
        </form>

        <section class="preview" aria-label="Preview" data-t-aria-label="preview.label">
          <div class="code" id="code"></div>
          <p class="info" id="info"></p>
          <div class="actions">
            <button class="btn" type="button" id="png" data-t="preview.png">Download PNG</button>
            <button class="btn quiet" type="button" id="svg" data-t="preview.svg">Download SVG</button>
            <button class="btn quiet" type="button" id="copy" data-t="preview.copy">Copy</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="bottom">
      <a href="https://github.com/wharrison2" data-t="footer.github">GitHub</a>
      <button type="button" data-mode-toggle></button>
    </footer>
  </div>
</body>
</html>
